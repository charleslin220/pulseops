services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulseops
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pulseops -d pulseops"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    command: [migrate]
    environment:
      DATABASE_URL: postgres://pulseops:${POSTGRES_PASSWORD}@db:5432/pulseops?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://pulseops:${POSTGRES_PASSWORD}@db:5432/pulseops?sslmode=disable
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate: {condition: service_completed_successfully}
  seed:
    build: ./backend
    command: [seed]
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://pulseops:${POSTGRES_PASSWORD}@db:5432/pulseops?sslmode=disable
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env}
    depends_on:
      migrate: {condition: service_completed_successfully}
  seed-demo:
    build: ./backend
    command: [seed-demo]
    environment:
      DATABASE_URL: postgres://pulseops:${POSTGRES_PASSWORD}@db:5432/pulseops?sslmode=disable
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend: {condition: service_started}
      seed-demo: {condition: service_completed_successfully}
volumes:
  postgres_data:
